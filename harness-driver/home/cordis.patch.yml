# Lore harness driver — the dsh composition for the agent line.
#
# Applied as the DSH_HOME patch layer over the `lore` profile (bundles:
# @deepseek-ai/dsh-base only — no web/headless/tui app). The Lore plugin is
# inserted BY PATH (it lives at /dsh/lore-driver inside the image, so its
# imports resolve against the harness workspace — same shape as the spike's
# spike-plugin).
#
# ── The AGENT PRESET ──────────────────────────────────────────────────────────
# What the agent is FOR lives HERE, as configuration — never as prompt text in
# the plugin. The per-turn system prompt is built by Lore's prep layer and
# handed over as the agent's COMPLETE prompt section (see the plugin's setup);
# the preset below narrows everything ELSE: no harness identity, no runtime
# contexts, no persona row (the coding-agent character's suppressor — spike-
# verified with the sandbox left writable), sandbox read-only (document tools
# go through the Tool-API proxies, never the local FS), and every dsh-base
# pack/tool row disabled (skills, subagents, scheduling, MCP are the step-5
# card's to earn or kill).

- insert:
    - id: lore-driver
      name: '/dsh/lore-driver/src/index.ts'
    # Brave / Tavily / SearXNG search providers for the `web` seam.
    - id: lore-web-search
      name: '/dsh/lore-driver/src/web-search/index.ts'

# The LLM route: llm-pi-ai, mounted DORMANT (upstream's own shape — zero
# routes until a settings section supplies provider profiles; the web Models
# page is the upstream writer, the lore-driver's turns are ours). Every TURN
# declares the ONE `lore` provider route (ensureModelEntry): apiKeyEnv
# LORE_AGENT_API_KEY, api openai-completions, the turn's gateway baseURL, the
# compat trio and defaultContextWindow 128000 (the plugin's loreRoute
# constant), plus the per-model catalog (contextWindow / maxTokens / image
# input / reasoningEfforts).
# WHY the route is NOT declared here as config: `providers` is the volatile
# field of llm-pi-ai's Config, and every settings write clones the entry's
# config through the volatile path — a `!!js` expression inside the volatile
# subtree survives as a plain object and the write fails validation
# ($.providers.lore.baseURL expected string). Env-bound values ride the
# settings document (plain JSON), never the patch layer.
# WHY llm-pi-ai and not the old native adapter: the effort picker offers the
# gateway's per-model levels, and llm-pi-ai's per-model `reasoningEfforts`
# dict is the only dsh mechanism where the offered levels are configuration
# (the old route's set was hard-coded to off/low/high/max and died with
# UNSUPPORTED_REASONING_EFFORT on anything else); the plugin upserts each
# model's advertised levels into its catalog entry (ensureModelEntry), so
# what the UI offers is what the wire takes, spelled as the gateway spells
# it. compat mirrors what the old route sent and the gateway accepts: system
# messages keep `role: system`, the output cap is `max_tokens`, the effort is
# a bare `reasoning_effort` (openai thinking format). defaultContextWindow
# is kept from the old row: pi-ai's own fallback (262144) would silently
# change the context_usage denominator for an id the gateway does not list.
# No env fallbacks: an unset LORE_AI_API_URL skips the route write and the
# first request fails loud instead of pretending to have a route. No
# `maxTokens`: the per-turn output cap is the router's per-model
# `max_completion_tokens`, upserted into the catalog entry by the plugin
# (ensureModelEntry) — a profile-wide number would re-hardcode the deleted
# 8192 cap that cut every model below its real ceiling. NO route-level
# `reasoning`: a route default would ride every Default turn — Default must
# send nothing.
- id: llm-pi-ai
  disabled: false

# The old native adapter, disabled (same mechanism as the tool rows below):
# dsh-base mounts it unconditionally with the PUBLIC DeepSeek endpoint as its
# default, and DEEPSEEK_API_KEY is in the harness env — a missed provider
# rename would fail SOFT onto the real DeepSeek API instead of loud.
- id: llm-deepseek
  disabled: true
# DeepSeek account/session surfaces: our only route is llm-pi-ai → `lore`.
- id: deepseek-account
  disabled: true
- id: llm-deepseek-account
  disabled: true

# The entry itself must stay: dsh's session-controller injects
# agentDefaultModel, and an absent row breaks activation. Its env link is cut
# — the empty string, the value every fresh public install already evaluates
# (undefined FAILS the entry's own validation: "$.model missing required
# value", proven on the gray boot): the model comes only from the turn, never
# from the composition (plan component-wiring-not-settings step 3).
- id: agent-default-model
  config:
    provider: lore
    model: ''

# Lore's prep layer owns the whole prompt; the harness contributes nothing
# (no identity opener, no runtime contexts, no persona row).
- id: system-prompt
  config:
    persona: ''
    includeHarnessIdentity: false
    includeRuntimeContext: false

# Read-only sandbox: nothing to write (zero tools), and confinement stays
# narrow even if a future row re-enables a tool by mistake.
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()

# The approval ask service (plan collapse-agent-stack-onto-dsh-vocabulary
# step 7): the plugin's mutating confirm calls ASK through ctx.approval — the
# audit pair (approval/asked + approval/decided) lands on the dsh session log
# and Lore's verdict surface answers the request (approvals.ts bridge). The
# permission preset registry stays disabled: it exists for the shell/sandbox
# tools this composition serves none of.
- id: approval
  config:
    policy: ask
- id: permission
  disabled: true

# Session titles come from the harness titler: dsh-base composes
# session-title-first-prompt-llm under the `session-title-llm` id below (a
# config there REPLACES the base row's). It runs once per fresh non-fork
# session on the first prompt and never retries on its own — acceptable
# because the session-title service's deterministic first-words fallback
# always lands before any model call. WHY `lore`: it is the
# single provider route this composition declares (the llm-pi-ai `lore` route
# above, pointing at OUR gateway — the same route agent-default-model rides).
# WHY the model must be non-reasoning on the gateway: the title call names no
# effort, and on this openai-format route a request with no
# `reasoning_effort` gets the PROVIDER's default — there is no per-purpose
# way to say "don't think", so a reasoner would think on every title. The
# plugin's turn gate warns loudly (assertNonReasoningTitleModel) and upserts
# the model's id-only catalog entry per turn (ensureTitleEntry). The title's
# byte budget: dsh-base caps a title at 80 UTF-8 bytes (40 Cyrillic
# characters) and cuts it mid-word; the UI ellipsizes a long title itself
# (ChatRow `truncate`), so the budgets here sit wide and the deterministic
# first-words fallback keeps its 5-word cap.
- id: session-title
  config:
    fallbackMaxWords: 5
    fallbackMaxBytes: 4096
    maxTitleBytes: 4096

# The titler's LLM policy: the five fixed fields live in the profile patch
# (the config-editor's write target — see profiles/lore/cordis.patch.yml);
# the provider/model pair is PER-TURN state, applied by the plugin from the
# payload's title_model (admin CHAT_TITLE_MODEL, else the backend's
# CHAT_MODEL): set while one is named, removed when it is empty — the titler
# then rides the session's own logged route, so the entry activates on an
# install with no AI config. dsh refuses a half or empty pair at activation,
# which is why no pair is committed here.
- id: session-title-llm
  disabled: false

# Raw JSONL (not zstd frames): the Lore-side tooling (and any post-mortem of a
# drive) can line-read the session logs without the backend codec.
- id: session-persistence-jsonl
  config:
    root: !!js (process.env.DSH_HOME || process.cwd()) + '/sessions'
    compression: 'none'

# ── zero-tools: disable every tool/command/goal/subagent row of dsh-base ──────
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: fs-observation-policy
  disabled: true
# ── skills (step 8: dsh's skill/* is the vocabulary) ──────────────────────────
# The registry + the model-facing `skill` loader tool. Lore's skills arrive
# per turn as payload metadata; the plugin's lore-skills provider (skills.ts)
# serves them to this registry, dsh publishes the durable catalog, and a
# successful load through the `skill` tool lifts the pack restriction.
- id: skill
  disabled: false
- id: tool-skill
  disabled: false
- id: skill-filesystem
  disabled: true

- id: agent-instructions
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: repeat-tool-reminder
  disabled: false
  config:
    # The advisory repeat guard (plan collapse-agent-stack-onto-dsh-vocabulary
    # step 9 — it replaces the deleted turn_budget's per-target repeat bound).
    # Tracked: the mutating surface (an identical repeated edit/create is a
    # stuck loop). Exempt, with the WHYs the old bound encoded:
    #   sandbox_bash / generate_image — identical repeats are legitimate
    #     (re-run after a fix; regenerate with a fresh seed);
    #   read_* / search_* / get_* — repeated reads are ordinary work, and the
    #     old bound never touched read-only tools;
    #   skill — reloads are cheap and idempotent;
    #   next_reference — idempotent re-serve is the RETRY shape;
    #   subagent — one blocking dispatch per child by construction.
    exclude:
      - sandbox_bash
      - generate_image
      - skill
      - next_reference
      - subagent
      - 'read_*'
      - 'search_*'
      - 'get_*'
      - list_*
# timeout-policy (step 9): arms the per-call deadline every READ-ONLY proxy
# declares (tools.ts — mutating proxies declare none: an approval ask parks up
# to LORE_APPROVAL_MAX_S and a budget would kill exactly that ask).
- id: timeout-policy
  disabled: false
# web: the ONE web_search. The provider is chosen in Lore's admin settings
# ("Web search") and rides every turn payload: the plugin edits the `web`
# entry's `searchProvider` through the config editor when it differs
# (profiles/lore/cordis.patch.yml carries the static default — the home row
# must stay config-less or the editor refuses the entry) and writes the
# credential under the ONE ref LORE_WEB_SEARCH_KEY. Providers: dsh's own
# web-search-deepseek (Anthropic-compatible Messages API, a different plane
# from the AI_API_* chat route) and lore-web-search above — every one of them
# resolves the key at call time, so an admin change reaches the next search.
# INVARIANT: `searchProvider` is pinned, always. Why: unpinned, dsh-web picks
# any usable provider, and DeepSeek with a resolver is always usable — a
# silent fallback; there is no off state, and a provider without a key/URL
# fails its calls loudly naming itself and the admin path.
- id: web
  disabled: false
# dsh's own DeepSeek provider resolves apiKeyEnv through the credentials
# service per request: the per-turn credential write (LORE_WEB_SEARCH_KEY)
# serves it too. WHY not DEEPSEEK_API_KEY: credentials-local lets the
# inherited env win and refuses to write a ref it holds, and prod's .env sets
# DEEPSEEK_API_KEY — the same reason LORE_AGENT_API_KEY exists.
- id: web-search-deepseek
  disabled: false
  config:
    apiKeyEnv: LORE_WEB_SEARCH_KEY
# A `config` here REPLACES the base bundle's, so the two values it set are
# restated. `fetch: false` is upstream's deliberate choice and stays: the
# `web-fetch-http` provider defers SSRF protection to the caller while the MODEL
# picks the request target, and no fetch provider is mounted here — turning the
# tool on without one served a `web_fetch` that failed every call.
# `search: true`, STATIC: web_search is always offered to the model — there is
# no off state; a provider without a key fails the call loudly, and to stop
# searching an admin clears the key.
- id: tool-web
  disabled: false
  config:
    search: true
    fetch: false
    searchTimeoutMs: 60000
    searchMaxResults: 8
    searchMaxQueries: 4
- id: commands
  disabled: true
- id: command-feedback
  disabled: true
- id: command-compact
  disabled: true
- id: plan-mode
  disabled: true
# Interactive coding-agent surface, gated only on profileContext — and we
# boot `--profile lore` (this composition serves Lore's Tool-API tools only).
- id: plugin-manager
  disabled: true
# config-editor stays ENABLED (a 0.2.0 ruling): the settings service injects
# `configEditor`, and the plugin's llm-pi-ai catalog upsert (the per-turn
# maxTokens cap, image input, reasoningEfforts) rides `ctx.get('settings')` —
# disabling this row leaves the settings fiber PENDING and every turn 502s.
# It serves no tool and adds no prompt section; the served-surface
# comparison after a pin move is the guard.
# MCP resource exposure: no MCP server is mounted for the agent line.
- id: mcp-resources
  disabled: true
# ── subagents ─────────────────────────────────────────────────────────────────
# The ctx.subagents registry + the stock DISPATCH tool (foreground one-shot =
# BLOCKING: the call waits for the child's result — async stays out per
# subagents-v2's Open). The provider is the stock spawn-in-process: a fresh
# child with its own session (log header `origin: subagent`) and zero parent
# history, whose shared driver owns depth checking, persona, tool-filter,
# one-shot execution, result reading and quiescent disposal. Return path:
# the child's final assistant message settles as the dispatching call's OWN
# tool/result — `send_message`/`subagent-settled` belong to CONTINUABLE
# (background) children only, so tool-subagent-control stays disabled below.
- id: subagent
  disabled: false
- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false
- id: subagent-spawn-in-process
  disabled: false
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-fork
  disabled: true
# The PTC (spawned sandboxed Node runtime) workflow plane — `tool-workflow`
# is already disabled below, so the runtime and its row ride along off.
- id: ptc-runtime
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
# Spill's whole value is the locator it hands the model ("stored at: … use
# read with offset/limit, or grep this path"), and this composition serves NO
# filesystem tool (tool-fs / tool-fs-search disabled above) — a spill would
# truncate a result and point at a path nothing can open. The size bound sits
# at acquisition instead (AGENT_READ_MAX_CHARS with offset/limit paging in
# read_document).
- id: spill-local
  disabled: true
- id: spill-policy
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: hmr
  disabled: true
- id: session-telemetry-otel
  disabled: true
# otel itself (the tracing plane session-telemetry-otel rides): no collector
# is wired for the agent line.
- id: otel
  disabled: true
