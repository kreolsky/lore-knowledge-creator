<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lore Recorder Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 16px;
      -webkit-user-select: none;
      user-select: none;
    }
    h3 { font-size: 14px; margin-bottom: 12px; color: #fff; }
    label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
    input[type="text"], input[type="password"], input[type="number"] {
      width: 100%;
      padding: 8px;
      background: #2d2d2d;
      border: 1px solid #444;
      border-radius: 0;
      color: #d4d4d4;
      font-family: monospace;
      font-size: 12px;
      outline: none;
    }
    input:focus { border-color: #0078d4; }
    .btn {
      display: inline-block;
      padding: 6px 14px;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 0;
      cursor: pointer;
      font-size: 12px;
      margin-top: 12px;
    }
    .btn:hover { background: #106ebe; }
    .status {
      margin-top: 8px;
      font-size: 11px;
      color: #6a9955;
      min-height: 16px;
    }
    .field { margin-bottom: 12px; }
    .check { display: flex; align-items: center; gap: 8px; color: #d4d4d4; margin-bottom: 0; cursor: pointer; }
    .check input {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border: 1px solid #444;
      border-radius: 0;
      background: #2d2d2d;
      cursor: pointer;
    }
    .check input:checked { background: #0078d4; border-color: #0078d4; }
  </style>
</head>
<body>
  <h3>Lore Recorder Settings</h3>
  <div class="field">
    <label for="api-key">API Key (all-in-one)</label>
    <input type="password" id="api-key" placeholder="Paste your API key here" />
  </div>
  <div class="field">
    <label for="retention">Keep local recordings (days)</label>
    <input type="number" id="retention" min="1" max="30" value="2" style="width: 80px" />
  </div>
  <div class="field" id="system-audio-row" hidden>
    <label class="check"><input type="checkbox" id="system-audio" /> Record system audio (call participants)</label>
  </div>
  <button class="btn" id="save-btn">Save</button>
  <div class="status" id="status"></div>
  <script>
    var invoke = window.__TAURI__.core.invoke;

    var apiKeyInput = document.getElementById("api-key");
    var retentionInput = document.getElementById("retention");
    var systemAudioRow = document.getElementById("system-audio-row");
    var systemAudioInput = document.getElementById("system-audio");
    var saveBtn = document.getElementById("save-btn");
    var statusEl = document.getElementById("status");

    invoke("get_api_key").then(function(key) {
      if (key) apiKeyInput.value = key;
    }).catch(function(e) {
      console.error("Failed to load key", e);
    });

    invoke("get_retention_days").then(function(days) {
      retentionInput.value = days;
    }).catch(function() {});

    invoke("get_record_system_audio").then(function(enabled) {
      if (enabled === null) return;
      systemAudioInput.checked = enabled;
      systemAudioRow.hidden = false;
    }).catch(function(e) {
      statusEl.textContent = "Failed to load system audio setting: " + e;
      statusEl.style.color = "#f44747";
    });

    saveBtn.addEventListener("click", function() {
      var key = apiKeyInput.value.trim();
      var days = parseInt(retentionInput.value) || 2;

      if (!key) {
        statusEl.textContent = "Key cannot be empty";
        statusEl.style.color = "#f44747";
        return;
      }

      var saves = [
        invoke("set_api_key", { key: key }),
        invoke("set_retention_days", { days: days })
      ];
      if (!systemAudioRow.hidden) {
        saves.push(invoke("set_record_system_audio", { enabled: systemAudioInput.checked }));
      }
      Promise.all(saves).then(function() {
        statusEl.textContent = "Saved!";
        statusEl.style.color = "#6a9955";
      }).catch(function(e) {
        statusEl.textContent = "Error: " + e;
        statusEl.style.color = "#f44747";
      });
    });
  </script>
</body>
</html>
