# Lore — self-hosted install.
#
#   curl -O https://raw.githubusercontent.com/kreolsky/lore-knowledge-creator/main/docker-compose.yml
#   docker compose up -d
#
# Then open http://localhost:8080 and sign in as admin@lore.app / lore-admin
# (change the password in your profile). No .env is needed; to change anything,
# put VAR=value lines in a .env file next to this one — every ${VAR:-default}
# below and every setting in .env.example can be set there.
#
# AI features (agent chat) are off until you add a .env with AI_API_URL,
# AI_API_KEY, HARNESS_MODEL and HARNESS_DRIVER_SECRET and run
#   docker compose --profile ai up -d

name: lore

x-app-env: &app-env
  SURREAL_URL: ws://surreal:8000/rpc
  SURREAL_USER: ${SURREAL_USER:-root}
  SURREAL_PASS: ${SURREAL_PASS:-root}
  SURREAL_NS: ${SURREAL_NS:-lore}
  SURREAL_DB: ${SURREAL_DB:-main}
  REDIS_URL: redis://redis:6379/0
  STORAGE_PATH: /storage
  CONVERTER_URL: http://converter:8002
  MAX_AUDIO_SIZE_MB: ${MAX_AUDIO_SIZE_MB:-500}
  MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-50}
  MAX_MARKDOWN_SIZE_MB: ${MAX_MARKDOWN_SIZE_MB:-50}
  # Empty = the backend generates a random key on first boot and keeps it in the
  # storage volume.
  LORE_SECRET_KEY: ${LORE_SECRET_KEY:-}
  # The first admin, created once on first boot.
  LORE_ADMIN_USERNAME: ${LORE_ADMIN_USERNAME:-admin}
  LORE_ADMIN_PASSWORD: ${LORE_ADMIN_PASSWORD:-lore-admin}
  # The default chat model is the agent's model unless set on its own.
  CHAT_MODEL: ${CHAT_MODEL:-${HARNESS_MODEL:-}}

x-app: &app
  image: ghcr.io/kreolsky/lore-backend:${LORE_VERSION:-stable}
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: *app-env
  volumes:
    - storage:/storage
  depends_on:
    surreal:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  surreal:
    image: surrealdb/surrealdb:v3.3.0
    command: start --user ${SURREAL_USER:-root} --pass ${SURREAL_PASS:-root} --bind 0.0.0.0:8000 surrealkv:///data/lore.db
    user: root
    restart: unless-stopped
    volumes:
      - surreal:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  worker:
    <<: *app
    command: arq jobs.worker.WorkerSettings

  worker-transcription:
    <<: *app
    command: arq jobs.worker.TranscriptionWorkerSettings

  converter:
    image: ghcr.io/kreolsky/lore-converter:${LORE_VERSION:-stable}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ghcr.io/kreolsky/lore-frontend:${LORE_VERSION:-stable}
    restart: unless-stopped
    ports:
      - "${LORE_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # The agent loop. Not published as an image (it bundles a dependency that may not
  # be redistributed), so it is built from this repository on first `--profile ai up`.
  harness:
    profiles: ["ai"]
    build: https://github.com/kreolsky/lore-knowledge-creator.git#${LORE_VERSION:-main}:harness-driver
    image: lore-harness:${LORE_VERSION:-main}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8090"
      LORE_DRIVER_SECRET: ${HARNESS_DRIVER_SECRET:-}
      LORE_AI_API_URL: ${AI_API_URL:-}
      LORE_HARNESS_MODEL: ${HARNESS_MODEL:-}
      # Session titles use CHAT_TITLE_MODEL, else CHAT_MODEL; without either the
      # harness refuses to start.
      CHAT_MODEL: ${CHAT_MODEL:-${HARNESS_MODEL:-}}
      LORE_HARNESS_CONTEXT_WINDOW: ${HARNESS_CONTEXT_WINDOW:-128000}
      LORE_TOOL_API_URL: http://backend:8001
    volumes:
      - harness-sessions:/app/home/sessions
    depends_on:
      backend:
        condition: service_healthy

volumes:
  surreal:
  redis:
  storage:
  harness-sessions:
