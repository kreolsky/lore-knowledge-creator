# The scheme the BROWSER used: the operator's TLS proxy's X-Forwarded-Proto when
# there is one, else this server's own (plain HTTP). WHY: nginx here always
# listens on 80, so `$scheme` alone would tell the backend every request is
# http and the session cookie could never be Secure (auth.set_session_cookie).
map $http_x_forwarded_proto $lore_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Link-preview bot UA → 1. WHY a map: the /docs/<id> location below needs a
# single flag to branch on. `~*` = case-insensitive; `default 0` mandatory —
# every other client (humans) gets the SPA, not the preview. An incomplete UA
# list degrades to the generic SPA title, nothing breaks; adding a messenger
# is a one-line edit here.
map $http_user_agent $lore_link_bot {
    default 0;
    "~*(TelegramBot|WhatsApp|facebookexternalhit|Facebot|Slackbot|Twitterbot|Discordbot|vkShare|LinkedInBot|SkypeUriPreview|redditbot|Iframely|Embedly|Applebot|Pinterest|Viber)" 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 600M;

    # ── Gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # ── Static asset caching ──────────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Legacy document URL → canonical /docs/<id> (plan "public-document-ids") ──
    # The document uuid is the one canonical URL. A pure string rewrite (no
    # proxy_pass to a lookup) — the project segment is simply dropped. Fires
    # before the SPA fallback below; only matches page URLs (no /api/ prefix), so
    # API/WS routes are untouched. The client has a matching <Navigate> for dev.
    location ~ ^/projects/[^/]+/docs/([^/]+)$ {
        return 301 /docs/$1;
    }

    # ── Link previews: bot UAs on /docs/<id> → backend Open Graph card ────
    # A bot UA gets the tiny og:* page (rewritten into the existing
    # `location /api/` below); every other client the SPA. WHY `rewrite …
    # last` and not a proxy inside the `if`: try_files is illegal inside
    # `if`, and `last` re-enters location matching into `location /api/`,
    # inheriting its Host and X-Forwarded-Proto $lore_forwarded_proto headers
    # — a hand-copied proxy block that forgot the latter would put http://
    # into og:image behind the TLS proxy.
    location ~ ^/docs/([^/]+)$ {
        if ($lore_link_bot) {
            rewrite ^/docs/([^/]+)$ /api/public/documents/$1/preview last;
        }
        try_files /index.html =404;
    }

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss:; font-src 'self';" always;

    # ── Backend upstream: resolved at request time ────────────────────────
    # WHY: a deploy recreates `backend` with a NEW container IP whenever its
    # image changes, but leaves this container running when its own image does
    # not. nginx resolves a literal upstream name once at startup and caches it
    # forever, so a stale frontend keeps proxying to the dead old IP → 502 on
    # every /api/* and /ws/* until it is restarted. The resolver + variable form
    # re-resolves per query (TTL 10s); 127.0.0.11 is Docker's embedded DNS.
    # WHY: no URI part on the proxy_pass targets below. With a variable in
    # proxy_pass nginx does NO prefix substitution — a URI part, if present,
    # REPLACES the whole request URI (/api/documents/1 → /api/). The former
    # /api/→/api/ and /ws/→/ws/ rewrites were identities, so forwarding the
    # original URI unchanged is equivalent.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host backend;

    # ── MCP Universal Agent Gateway ──────────────────────────────────────
    # Proxies /mcp to the backend (the gateway is mounted at /mcp + /mcp/).
    # NO trailing path on proxy_pass → the original URI (/mcp, /mcp/) is forwarded
    # unchanged, like every backend location (see the upstream WHY above).
    # buffering off: the streamable-HTTP transport must not buffer. Prefix match
    # also catches stray /mcpfoo → backend 404 (harmless; no state-mutating
    # handler there) instead of an SPA HTML leak.
    location /mcp {
        proxy_pass http://$backend_host:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lore_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 660s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Operator downloads (e.g. the Android APK) ─────────────────────────
    # Files are dropped onto the host bind (docker-compose.prod.yml), not baked
    # into the image. WHY =404: the SPA fallback above would answer a typo'd
    # name with index.html + 200. WHY the types block: stock mime.types may lack
    # .apk, and Android only offers to install an APK served with its own type.
    location /downloads/ {
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://$backend_host:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lore_forwarded_proto;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /ws/ {
        proxy_pass http://$backend_host:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lore_forwarded_proto;
        proxy_read_timeout 86400s;
    }
}
