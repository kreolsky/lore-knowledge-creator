[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
# WHY: pytest-asyncio 1.x split test vs fixture loop scope into two settings; the new
# asyncio_default_test_loop_scope defaults to "function". With session-scoped async
# fixtures (admin_user, etc.) that mismatch raises "Future attached to a different loop"
# nondeterministically (order/loop-reuse dependent — green locally, red on the fresh CI DB).
# Pin the test loop to session so each test shares its session fixtures' loop, as
# pytest-asyncio 0.24 effectively did before the split.
asyncio_default_test_loop_scope = session
# WHY --timeout: a wedged await (Redis backplane listener / grace-session teardown) used
# to hang the whole suite forever — CI has no TTY to interrupt, so the runner sat 30+ min
# with no traceback. A per-test cap turns the hang into a failure with a stack dump of the
# stuck frame. --timeout-method=thread dumps ALL thread stacks (incl. the asyncio loop
# thread); the default signal method only watches the main thread and misses async hangs.
# 120s is well above the slowest legitimate WS-collab test.
# WHY --cov is NOT here: coverage instrumentation over /app dominates wall-clock
# (full suite ~30 min with cov vs ~6 min without). Local iteration must stay fast, so
# coverage is OPT-IN — pass `--cov=/app --cov-report=term-missing` explicitly. CI passes
# it on its own command line too, but ONLY on a `workflow_dispatch` with the `coverage`
# input set (.gitea/workflows/ci.yml) — per-push runs are cov-free so the single runner
# stays fast.
# WHY --session-timeout: a per-test cap cannot bound an ORPHANED run. When the
# `docker compose exec` client dies, docker does not signal the container-side
# pytest; it blocks forever on a stdout pipe nobody drains, so even --timeout
# cannot fire (its own stack dump would block on the same pipe). The session cap
# is the only bound that survives that state, and it applies to EVERY invocation
# because it lives in addopts — not in a wrapper script anyone can bypass.
# 2400s is 4x the slowest honest full run (~6 min serial, ~1.5 min at -n 4).
addopts = --timeout=120 --timeout-method=thread --session-timeout=2400
filterwarnings =
    ignore::DeprecationWarning:passlib
    ignore:Setting per-request cookies:DeprecationWarning:httpx

[coverage:run]
source = /app
omit =
    /app/seed_dev.py
    /app/migrations.py

[coverage:report]
show_missing = true
skip_empty = true
